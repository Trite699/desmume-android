name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch DeSmuME core sources
        run: |
          git clone --depth 1 https://github.com/TASEmulators/desmume "$RUNNER_TEMP/desmume-upstream"
          echo "DESMUME_SRC=$RUNNER_TEMP/desmume-upstream/desmume/src" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Compile Native JNI (if not wired into Gradle externalNativeBuild)
        run: |
          if [ -f "jni/Android.mk" ] && ! grep -q "externalNativeBuild" app/build.gradle 2>/dev/null && ! grep -q "externalNativeBuild" build.gradle 2>/dev/null; then
            $ANDROID_HOME/ndk/25.2.9519653/ndk-build -C . -j$(nproc)
          fi

      - name: Generate Gradle Wrapper (if missing)
        run: |
          if [ ! -f "./gradlew" ] && ( [ -f "build.gradle" ] || [ -f "build.gradle.kts" ] ); then
            gradle wrapper --gradle-version 8.7
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show the actual native build errors
        if: failure()
        run: |
          grep -n -B2 -A10 -E "FAILED:|error:|undefined (reference|symbol)|ld(\.lld)?: error" build.log | head -150 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: desmume-android-debug-apk
          path: |
            **/*.apk
